[project]
name = "pytailor"
version = "1.0.0"
description = "Tailor a resume to a job description, without inventing anything, from the command line."
requires-python = ">=3.11"
dependencies = [
  "python-docx>=1.1",
  "reportlab>=4.0",
]

[project.optional-dependencies]
# Reading a .pdf or .docx resume. Plain text needs nothing.
read = ["pypdf>=4.0", "python-docx>=1.1"]
dev = ["pytest>=8.0"]

[project.scripts]
pytailor = "pytailor.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
