# Render Blueprint — https://render.com/docs/blueprint-spec
#
# Two services from one repository, both on the free plan:
#
#   web-node   the original Next.js app
#   web-python the FastAPI rewrite
#
# They share the Neon database without colliding: the Python app's tables are
# lowercase and unprefixed (users, source_resumes), the Node app's are quoted
# and capitalised ("User", "SourceResume"). Neither sees the other's.
#
# Free instances sleep after about fifteen minutes idle, so the first visit
# after a quiet spell waits roughly thirty seconds. For a personal instance
# that is the right side of the bargain.
services:

  - type: web
    name: ats-resume-tailor
    runtime: node
    plan: free
    region: oregon
    # `npm ci` rather than `npm install`: the lockfile is the point of a
    # reproducible deploy. postinstall runs prisma generate, and the build
    # script rewrites the datasource to Postgres before generating again.
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/status
    envVars:
      # Pinned because the build runs Prisma and Next, and a silent major
      # version bump underneath a deploy is a bad way to find out about it.
      - key: NODE_VERSION
        value: "22"

      # Set these in the Render dashboard, not here. sync: false means Render
      # prompts for the value and keeps it out of the repository.
      - key: DATABASE_URL
        sync: false
      - key: AUTH_SECRET
        sync: false
      - key: OPENAI_COMPATIBLE_API_KEY
        sync: false
      # Mail, for the one-time codes. Without these the app still runs and
      # still issues codes — it prints them to the server log instead of
      # sending them, which is fine on a laptop and useless in production.
      - key: SMTP_HOST
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      # Optional: a Google Apps Script web app URL that appends a row per
      # sign-up and sign-in. Never receives passwords — there are none to send.
      - key: SHEETS_WEBHOOK_URL
        sync: false
      - key: SHEETS_WEBHOOK_SECRET
        sync: false

      - key: LLM_PROVIDER
        value: groq
      - key: OPENAI_COMPATIBLE_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: OPENAI_COMPATIBLE_MODEL
        value: openai/gpt-oss-120b
      - key: OPENAI_COMPATIBLE_TPM
        value: "8000"

      # A smaller model on the same key, tried when the primary is rate-limited
      # or the request is too large for the per-minute budget. An Ollama slot is
      # pointless here: on a host, localhost is the server, not your machine.
      - key: LLM_FALLBACKS
        value: smaller
      - key: LLM_SMALLER_MODEL
        value: openai/gpt-oss-20b

      # A metered provider refuses to run unless this is true. Everything above
      # is free, so spending money should take a deliberate act rather than an
      # absent-minded env change.
      - key: ALLOW_PAID_PROVIDERS
        value: "false"

      - key: MAX_UPLOAD_MB
        value: "5"
      - key: RATE_LIMIT_GENERATIONS_PER_HOUR
        value: "20"

# AUTH_URL is deliberately absent. NextAuth infers the host, and setting it to
# the wrong value — or to an empty string — breaks sign-in rather than fixing
# it. That already cost an afternoon on the Vercel deployment.

  - type: web
    name: resume-tailor-python
    runtime: docker
    plan: free
    region: oregon
    # Built from the repository root: the image needs both pytailor/ and
    # webapp/, and a context of webapp/ alone cannot see the engine.
    dockerfilePath: ./webapp/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      # Signs the session cookie. Without it the app refuses to start on a
      # managed host, because a missing key means either forgeable sessions or
      # everyone logged out on every deploy.
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: OPENAI_COMPATIBLE_API_KEY
        sync: false
      # Mail for the one-time codes. Without these the app still runs and still
      # issues codes - it prints them to the log instead of sending them, which
      # is right on a laptop and useless in production.
      - key: SMTP_HOST
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      # Optional: appends a row per sign-up and sign-in. Never receives a
      # password - there is none to send.
      - key: SHEETS_WEBHOOK_URL
        sync: false
      - key: SHEETS_WEBHOOK_SECRET
        sync: false
      - key: OPENAI_COMPATIBLE_MODEL
        value: openai/gpt-oss-120b
      - key: LLM_FALLBACKS
        value: smaller
      - key: LLM_SMALLER_MODEL
        value: openai/gpt-oss-20b
