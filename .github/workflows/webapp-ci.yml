name: webapp tests

on:
  push:
    paths: ["webapp/**", "pytailor/**", ".github/workflows/webapp-ci.yml"]
  pull_request:
    paths: ["webapp/**", "pytailor/**"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ./pytailor
          python -m pip install -e "./webapp[dev]"
      # No API key: every test is offline, which is what lets this run on a
      # fork's pull request without handing it a secret.
      - name: Test
        working-directory: webapp
        run: python -m pytest tests -q
